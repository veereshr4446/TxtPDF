name: Validate

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Check HTML basics
        run: |
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'lang="en"' index.html
          test -f style.css
          test -f script.js

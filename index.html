<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a printable test paper from a list of questions and save it as a PDF.">
    <meta name="theme-color" content="#2563eb">
    <meta property="og:title" content="Test PDF Creator">
    <meta property="og:description" content="Create a printable test paper from a list of questions and save it as a PDF.">
    <meta property="og:type" content="website">
    <title>Test PDF Creator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<noscript>This app needs JavaScript enabled to work.</noscript>

<div class="container">

    <h1>Test PDF Creator</h1>

    <div class="form-section">
        <label for="testTitle">Test Title</label>
        <input type="text" id="testTitle" placeholder="e.g. Mathematics Test">

        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="e.g. Mathematics">

        <label for="answerLines">Answer Lines per Question</label>
        <select id="answerLines">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
        </select>
    </div>

    <h2>Questions</h2>

    <p id="questionCounter" class="counter no-print" aria-live="polite"></p>

    <div id="questions"></div>

    <button type="button" class="add-btn" onclick="addQuestion()">
        + Add Question
    </button>

    <button type="button" id="clearAllBtn" class="tool-btn no-print">
        Clear All
    </button>

    <button type="button" class="pdf-btn" onclick="generatePDF()">
        Generate PDF
    </button>

    <hr>

    <div id="preview" class="preview">
        <h1 id="previewTitle">Test Title</h1>

        <div class="student-info">
            <p><strong>Name:</strong> <span id="previewName">________________</span></p>
            <p><strong>Subject:</strong> <span id="previewSubject">________________</span></p>
            <p><strong>Date:</strong> __________________</p>
            <p><strong>Total Marks:</strong> <span id="previewTotal">0</span></p>
        </div>

        <hr>

        <div id="previewQuestions"></div>

    </div>

</div>

<footer class="site-footer no-print">
    <p>Test PDF Creator &middot; Free and open source under the MIT License</p>
</footer>

<script src="script.js"></script>

<script src="js/counter.js"></script>
<script src="js/clear-all.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/a11y.js"></script>
<script src="js/marks-limit.js"></script>
<script src="js/storage.js"></script>
<script src="js/duplicate.js"></script>
</body>
</html>
